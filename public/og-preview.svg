  </text>

  <g opacity="0.68" transform="translate(940 106)">
    <rect width="132" height="132" rx="20" fill="#261A12" stroke="#D38A67" stroke-opacity="0.62"/>
    <path d="M38 38H94V94H38V38Z" stroke="#DDA177" stroke-width="5"/>
    <path d="M38 66H94M66 38V94" stroke="#DDA177" stroke-width="5" stroke-linecap="round"/>
