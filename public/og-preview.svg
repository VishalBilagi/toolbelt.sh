<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">toolbelt.sh rich preview image</title>
  <desc id="desc">A warm, on-brand preview card for toolbelt.sh with the tagline Powerful Developer Tools. Zero Server Uploads.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#140D09"/>
      <stop offset="1" stop-color="#0F0A07"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 96) rotate(44) scale(560 360)">
      <stop stop-color="#D38A67" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#D38A67" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(988 510) rotate(-141) scale(540 360)">
      <stop stop-color="#DDA177" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#DDA177" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#F3BEA2" stroke-opacity="0.10" stroke-width="1"/>
      <path d="M24 0V48M0 24H48" stroke="#F3BEA2" stroke-opacity="0.065" stroke-width="1"/>
    </pattern>
    <linearGradient id="line" x1="120" y1="0" x2="1080" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D38A67" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#D38A67" stop-opacity="0.84"/>
      <stop offset="1" stop-color="#D38A67" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <rect x="88" y="84" width="1024" height="462" rx="28" fill="#1A120D" fill-opacity="0.78" stroke="#DDA177" stroke-opacity="0.24"/>
  <line x1="120" y1="174" x2="1080" y2="174" stroke="url(#line)" stroke-width="2"/>

  <text x="128" y="150" fill="#DDA177" font-family="Space Mono, monospace" font-size="28" font-weight="700" letter-spacing="1.4">toolbelt.sh</text>

  <text x="128" y="292" fill="#FFF0E9" font-family="Space Grotesk, Inter, system-ui, sans-serif" font-size="70" font-weight="700">
    Powerful Developer Tools.
  </text>
  <text x="128" y="368" fill="#FFF0E9" font-family="Space Grotesk, Inter, system-ui, sans-serif" font-size="70" font-weight="700">
